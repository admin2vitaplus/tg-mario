name: Web checks

on:
  pull_request:
    paths: ['web/**', 'tests/**', 'package.json']
  push:
    branches-ignore: [main, claude/project-thread-osht0u]
    paths: ['web/**', 'tests/**', 'package.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
