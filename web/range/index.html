<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Тир</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="range.css">
  <link rel="stylesheet" href="../lib/looks.css">
  <link rel="stylesheet" href="../lib/wallet.css">
  <script defer src="../lib/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div><span data-t="hud_score">СЧЁТ</span><br><span id="score">000000</span></div>
      <div><span data-t="hud_round">РАУНД</span><br><span id="round">1</span></div>
      <div><span data-t="hud_need">НУЖНО</span><br><span id="need">6</span></div>
      <div><span data-t="hud_best">РЕКОРД</span><br><span id="best">0</span></div>
    </div>
    <div id="game">
      <canvas id="screen" width="256" height="224"></canvas>
      <div id="banner" class="hidden"></div>
    </div>
    <div id="controls">
      <button id="btnCenter" class="pad" type="button" aria-label="Прицел по центру">⊕</button>
      <button id="btnFire" class="pad fire" type="button" data-t="btn_fire">ОГОНЬ</button>
      <span class="pad ghostPad"></span>
    </div>
    <div id="overlay">
      <h1 id="ovTitle">ТИР</h1>
      <p id="ovText">Сбивай птиц и тарелочки.</p>
      <div id="menu" class="ui-stack">
        <button id="btnPlay" class="ui-btn primary" data-t="menu_play">Играть</button>
        <button id="btnPick" class="ui-btn hidden" data-t="menu_pick">▦ Выбрать раунд</button>
        <button id="btnAim" class="ui-btn" data-t="menu_aim">⚙ Прицел</button>
        <button id="btnWallet" class="ui-btn teal wGameBtn" data-wallet-game="range">◆ Жетоны</button>
        <button id="btnLook" class="ui-btn" data-t="menu_look">🎨 Внешний вид</button>
      </div>
      <div id="aimPanel" class="ui-stack hidden">
        <p class="label" data-t="aim_mode">Чем целиться</p>
        <button id="modeGyro" class="ui-btn mode" data-t="aim_gyro">📱 Наклоном телефона</button>
        <button id="modeTouch" class="ui-btn mode" data-t="aim_touch">👆 Пальцем или мышью</button>
        <label class="row" id="speedRow"><span id="speedText">Чувствительность: 100%</span>
          <input id="speed" type="range" min="50" max="200" step="10" value="100"></label>
        <label class="row check" id="invXRow"><input id="invX" type="checkbox"> <span data-t="aim_invert_x">Наоборот по горизонтали</span></label>
        <label class="row check" id="invYRow"><input id="invY" type="checkbox"> <span data-t="aim_invert_y">Наоборот по вертикали</span></label>
        <p class="status" id="aimStatus"></p>
        <button id="aimDone" class="ui-btn primary" data-t="btn_done">Готово</button>
      </div>
      <div class="ui-stack" id="ovActs">
        <button id="ovBtn" class="ui-btn primary hidden">Дальше</button>
        <button id="ovAlt" class="ui-btn hidden">Ещё</button>
        <button id="ovPick" class="ui-btn hidden" data-t="menu_pick">▦ Выбрать раунд</button>
        <button id="ovShare" class="ui-btn hidden" data-t="btn_share">Поделиться итогом</button>
        <button id="ovMenu" class="ui-btn ghost hidden" data-t="btn_all_games">← Все игры</button>
      </div>
      <p class="hint" id="ovHint"></p>
      <a id="back" class="ui-btn ghost" href="../" data-t="back">← Все игры</a>
    </div>
  </div>
  <script defer src="../config.js"></script>
  <script defer src="../sw-register.js"></script>
  <script defer src="../lib/server.js"></script>
  <script defer src="../lib/wallet.js"></script>
  <script defer src="../lib/looks.js"></script>
  <script defer src="../lib/events.js"></script>
  <script defer src="../lib/back.js"></script>
  <script defer src="../lib/progress.js"></script>
  <script defer src="strings.js"></script>
  <script defer src="sim.js"></script>
  <script defer src="aim.js"></script>
  <script defer src="range.js"></script>
</body>
</html>
