<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Слово дня</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="word.css">
  <link rel="stylesheet" href="../lib/looks.css">
  <link rel="stylesheet" href="../lib/wallet.css">
  <script src="../lib/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header id="top">
      <h1 id="title">СЛОВО ДНЯ</h1>
      <p id="sub"></p>
      <div id="tools">
        <button id="btnLang" type="button">RU</button>
        <button id="btnRules" type="button">?</button>
        <button id="btnChat" type="button">🏆</button>
        <button id="btnLooks" type="button">🎨</button>
        <button id="btnWallet" type="button" class="wGameBtn" data-wallet-game="word" data-short="1">◆</button>
      </div>
    </header>
    <main id="board" aria-live="polite"></main>
    <p id="msg"></p>
    <section id="result" class="hidden"></section>
    <div id="keys"></div>
  </div>
  <script src="../config.js"></script>
  <!-- Switched off in config.js: an old link or bookmark goes to the menu instead. -->
  <script>if (window.CARTRIDGE && !window.CARTRIDGE.isEnabled('word')) location.replace('../' + location.search);</script>
  <script src="../sw-register.js"></script>
  <script src="../lib/server.js"></script>
  <script src="../lib/wallet.js"></script>
  <script src="../lib/looks.js"></script>
  <script src="../lib/events.js"></script>
  <script src="../lib/back.js"></script>
  <script src="word.js"></script>
</body>
</html>
