<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Жёлтый картридж</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scores.css">
  <link rel="stylesheet" href="lib/wallet.css">
  <!-- Local copy: telegram.org is slow to reach from some networks and would block the page. -->
  <script src="lib/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div>СЧЁТ<br><span id="score">000000</span></div>
      <div>МОНЕТЫ<br><span id="coins">×00</span></div>
      <div>ЖИЗНИ<br><span id="lives">3</span></div>
      <div>МИР<br><span id="world">1-1</span></div>
      <div>ВРЕМЯ<br><span id="time">300</span></div>
    </div>
    <div id="game"></div>
    <div id="controls">
      <div id="dpad">
        <div class="btn up">▲</div>
        <div class="btn left">◀</div>
        <div class="btn right">▶</div>
        <div class="btn down">▼</div>
      </div>
      <div id="actions">
        <div class="btn round turbo" id="btnTB">ТУРБО<br>B</div>
        <div class="btn round turbo" id="btnTA">ТУРБО<br>A</div>
        <div class="btn round ab" id="btnB">B</div>
        <div class="btn round ab" id="btnA">A</div>
      </div>
    </div>
    <div id="menu">
      <h1>ЖЁЛТЫЙ КАРТРИДЖ</h1>
      <ol id="menuList"></ol>
      <p class="hint">Выберите игру</p>
    </div>
    <div id="overlay">
      <h1 id="ovTitle">ПРЫГ-СКОК</h1>
      <p id="ovText">Добеги до флага, собирай монеты,<br>прыгай на жуков.</p>
      <button id="ovBtn">Играть</button>
      <button id="ovLooks">🎨 Внешний вид</button>
      <button id="ovMenu">← Все игры</button>
      <p class="hint" id="ovHint">Клавиатура: стрелки, A — Z/пробел, B (бег и огонь) — X/Shift, турбо A — A, турбо B — S</p>
    </div>
  </div>
  <!-- Only the menu loads up front; a game's own files (the engine too) load
       when it is chosen, see config.js. -->
  <script src="config.js"></script>
  <script src="lib/server.js"></script>
  <script src="menu.js"></script>
  <script src="lib/events.js"></script>
  <script src="api.js"></script>
  <script src="lib/wallet.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
