<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Жёлтый картридж</title>
  <link rel="stylesheet" href="lib/ui.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scores.css">
  <link rel="stylesheet" href="lib/wallet.css">
  <!-- Local copy: telegram.org is slow to reach from some networks and would block the page. -->
  <script src="lib/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div><span data-en="SCORE">СЧЁТ</span><br><span id="score">000000</span></div>
      <div><span data-en="GOLD">ЗОЛОТО</span><br><span id="coins">×00</span></div>
      <div><span data-en="LIVES">ЖИЗНИ</span><br><span id="lives">3</span></div>
      <div><span data-en="WORLD">МИР</span><br><span id="world">1-1</span></div>
      <div><span data-en="TIME">ВРЕМЯ</span><br><span id="time">300</span></div>
    </div>
    <div id="game"></div>
    <div id="controls">
      <div id="dpad">
        <div class="btn up">▲</div>
        <div class="btn left">◀</div>
        <div class="btn right">▶</div>
        <div class="btn down">▼</div>
      </div>
      <div id="actions">
        <div class="btn round turbo" id="btnTB" data-en="TURBO<br>B">ТУРБО<br>B</div>
        <div class="btn round turbo" id="btnTA" data-en="TURBO<br>A">ТУРБО<br>A</div>
        <div class="btn round ab" id="btnB">B</div>
        <div class="btn round ab" id="btnA">A</div>
      </div>
    </div>
    <div id="menu">
      <h1 data-en="YELLOW CARTRIDGE">ЖЁЛТЫЙ КАРТРИДЖ</h1>
      <ol id="menuList"></ol>
      <p class="hint" data-en="Choose a game">Выберите игру</p>
    </div>
    <div id="overlay">
      <h1 id="ovTitle" data-en="HOP-SKIP">ПРЫГ-СКОК</h1>
      <p id="ovText" data-en="Run to the flag, collect gold,<br>jump on the beetles.">Добеги до флага, собирай золото,<br>прыгай на жуков.</p>
      <div class="ui-stack" id="ovActs">
        <button id="ovBtn" class="ui-btn primary" data-en="Play">Играть</button>
        <button id="ovLooks" class="ui-btn" data-en="🎨 Looks">🎨 Внешний вид</button>
        <button id="ovMenu" class="ui-btn ghost" data-en="← All games">← Все игры</button>
      </div>
      <p class="hint" id="ovHint" data-en="Keyboard: arrows, A is Z/Space, B (run and fire) is X/Shift, turbo A is A, turbo B is S">Клавиатура: стрелки, A — Z/пробел, B (бег и огонь) — X/Shift, турбо A — A, турбо B — S</p>
    </div>
  </div>
  <!-- Only the menu loads up front; a game's own files (the engine too) load
       when it is chosen, see config.js. -->
  <script src="config.js"></script>
  <script src="lib/server.js"></script>
  <script src="menu.js"></script>
  <script src="lib/events.js"></script>
  <script src="api.js"></script>
  <script src="lib/wallet.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
